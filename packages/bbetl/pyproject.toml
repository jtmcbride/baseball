[project]
name = "bbetl"
version = "0.1.0"
description = "Ingestion jobs, source clients, transforms, and data quality checks"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bbcore",
    "httpx>=0.28",
    "polars>=1.17",
    "pyarrow>=18.0",
    "typer>=0.15",
    "rich>=13.9",
    "tenacity>=9.0",
    "pybaseball>=2.2",
]

[project.scripts]
bb = "bbetl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbetl"]
