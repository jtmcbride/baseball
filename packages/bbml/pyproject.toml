[project]
name = "bbml"
version = "0.1.0"
description = "Feature builders, datasets, training, and model serving"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bbcore",
    "polars>=1.17",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
# Kept out of the default install: heavy, and only needed once M2 model
# comparison starts.
tracking = ["mlflow>=2.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbml"]
