[project]
name = "bbcore"
version = "0.1.0"
description = "Shared config, storage adapter, and identity resolution"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "polars>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbcore"]
