[project]
name = "bbapi"
version = "0.1.0"
description = "Read-only JSON/Arrow API over the baseball warehouse"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bbcore",
    "bbml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyarrow>=18.0",
    "polars>=1.17",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbapi"]
